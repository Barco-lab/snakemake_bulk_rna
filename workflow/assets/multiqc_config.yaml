title: "bulk RNA-seq"
subtitle: "snakemake_bulk_rna"
report_comment: "Pipeline summary 表的 reads 按单条 read 计（PE 为 R1 + R2），rate 以进入该步骤的 reads 为分母（见表头括号），与各软件模块口径一致。详细数值与各列说明见 results/qc/summary.tsv 与 results/qc/report.html。"

# results/qc/summary.tsv 作为自定义表格
custom_data:
  pipeline_summary:
    file_format: "tsv"
    section_name: "Pipeline summary"
    description: "results/qc/summary.tsv（reads 按单条计，rate 以进入该步骤的 reads 为分母）"
    plot_type: "table"
sp:
  pipeline_summary:
    fn: "summary.tsv"

module_order:
  - custom_content
  - fastqc:
      name: "FastQC (raw)"
      path_filters: ["*/fastqc_raw/*"]
  - cutadapt
  - fastqc:
      name: "FastQC (trimmed)"
      path_filters: ["*/fastqc_trimmed/*"]
  - umitools
  - hisat2
  - featurecounts

extra_fn_clean_exts:
  - ".featureCounts.txt"
  - ".fastq.gz"
  - ".summary.txt"
  - ".dedup.log"
  - ".extract.log"

table_sample_merge:
  "Read 1": "_R1"
  "Read 2": "_R2"
