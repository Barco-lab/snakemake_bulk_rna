title: "bulk RNA-seq"
subtitle: "snakemake_bulk_rna"
report_comment: "Pipeline summary 表的 reads 按单条 read 计（PE 为 R1 + R2），rate 以 raw_reads 为分母；其余模块为各软件自身的统计口径。详细数值见 results/tables/summary.tsv。"

module_order:
  - custom_content
  - fastqc:
      name: "FastQC (raw)"
      path_filters: ["*/fastqc_raw/*"]
  - cutadapt
  - fastqc:
      name: "FastQC (trimmed)"
      path_filters: ["*/fastqc_trimmed/*"]
  - umitools
  - hisat2
  - featurecounts

extra_fn_clean_exts:
  - ".featureCounts.txt"
  - ".fastq.gz"
  - ".summary.txt"
  - ".dedup.log"
  - ".extract.log"

table_sample_merge:
  "Read 1": "_R1"
  "Read 2": "_R2"
